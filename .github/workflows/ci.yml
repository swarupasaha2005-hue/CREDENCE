name: CI

on:
  push:
  pull_request:

# Cancel superseded runs on the same ref to avoid wasting CI minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  detect:
    name: Detect package manager
    runs-on: ubuntu-latest
    outputs:
      manager: ${{ steps.detect.outputs.manager }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Detect package manager from lockfiles
        id: detect
        run: |
          if [ -f "pnpm-lock.yaml" ]; then
            echo "manager=pnpm" >> "$GITHUB_OUTPUT"
          elif [ -f "yarn.lock" ]; then
            echo "manager=yarn" >> "$GITHUB_OUTPUT"
          elif [ -f "package-lock.json" ]; then
            echo "manager=npm" >> "$GITHUB_OUTPUT"
          else
            echo "No lockfile found (expected pnpm-lock.yaml, yarn.lock, or package-lock.json) at repository root." >&2
            exit 1
          fi

  frontend:
    name: Frontend (SDK, build, tests)
    needs: detect
    runs-on: ubuntu-latest
    env:
      PM: ${{ needs.detect.outputs.manager }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: ${{ env.PM }}

      - name: Cache Next.js build cache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json', '**/yarn.lock', '**/pnpm-lock.yaml') }}-${{ hashFiles('src/**/*.ts', 'src/**/*.tsx', 'packages/**/*.ts') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json', '**/yarn.lock', '**/pnpm-lock.yaml') }}-

      - name: Install dependencies
        run: |
          case "$PM" in
            npm) npm ci ;;
            yarn) yarn install --frozen-lockfile ;;
            pnpm)
              corepack enable
              pnpm install --frozen-lockfile
              ;;
          esac

      - name: Build SDK
        run: |
          set -e
          shopt -s nullglob
          found=0
          for manifest in packages/sdk/bindings/*/package.json packages/sdk/package.json; do
            [ -f "$manifest" ] || continue
            dir=$(dirname "$manifest")
            if node -e "process.exit(require('./$manifest').scripts && require('./$manifest').scripts.build ? 0 : 1)"; then
              found=1
              echo "Building SDK package: $dir"
              (
                cd "$dir"
                case "$PM" in
                  npm) npm install ;;
                  yarn) yarn install ;;
                  pnpm) pnpm install ;;
                esac
                case "$PM" in
                  npm) npm run build ;;
                  yarn) yarn build ;;
                  pnpm) pnpm build ;;
                esac
              )
            fi
          done
          if [ "$found" -eq 0 ]; then
            echo "No SDK package with a build script was found under packages/sdk; skipping."
          fi

      - name: Build frontend
        run: |
          case "$PM" in
            npm) npm run build ;;
            yarn) yarn build ;;
            pnpm) pnpm build ;;
          esac

      - name: Run frontend tests
        run: |
          if node -e "const p=require('./package.json'); process.exit(p.scripts && p.scripts.test ? 0 : 1)"; then
            case "$PM" in
              npm) npm test ;;
              yarn) yarn test ;;
              pnpm) pnpm test ;;
            esac
          else
            echo "No \"test\" script defined in package.json; skipping frontend tests."
          fi

  # NOT a required check: see the "Known issue" notice below and in README.md.
  #
  # Known issue — contract tests currently fail to compile, upstream, not from this repo:
  #   soroban-sdk 22.0.11 (the newest 22.x release, and the version these contracts are
  #   pinned to) exactly pins soroban-env-host = "=22.1.3". That version of
  #   soroban-env-host declares an open-ended `ed25519-dalek = ">=2.0.0"` constraint,
  #   so Cargo resolves ed25519-dalek 3.0.0 / rand_core 0.10.x for it, while the
  #   ChaCha20Rng used elsewhere in the same dependency graph comes from
  #   rand_chacha 0.3.1, which is built on rand_core 0.6.x. The two rand_core majors
  #   are different, incompatible traits, so
  #   `SigningKey::generate(chacha)` in soroban-env-host's own testutils.rs fails to
  #   compile with `the trait bound ChaCha20Rng: CryptoRng is not satisfied`.
  #
  #   This is not fixable by relocking or pinning within the 22.x line: 22.0.11 is
  #   already the newest 22.x soroban-sdk release, and it hard-pins soroban-env-host
  #   to the exact broken version. The same open-ended ed25519-dalek constraint is
  #   still present upstream on soroban-env-host's main branch as of this writing, and
  #   affects soroban-sdk 27.x too, not just 22.x. Fixing it for real means bumping
  #   soroban-sdk past 22.x in each contract's Cargo.toml — a deliberate, separate
  #   decision, since it needs API-compatibility review against contract source and
  #   this pipeline is CI-only.
  #
  #   Upstream tracking: https://github.com/stellar/rs-soroban-env/issues/1705
  #   ("Fresh SDK 27 testutils lock resolves incompatible ed25519-dalek 3")
  #
  # This job is intentionally non-blocking (continue-on-error: true) so the failure
  # stays visible in the Actions UI instead of being hidden, while it does not block
  # merges on an upstream bug this repo can't fix from the CI side.
  contracts:
    name: Rust contract tests (known upstream issue — non-blocking)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            contracts/*/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('contracts/*/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Known issue notice
        run: |
          echo "::warning::Rust contract tests are known to fail to compile: soroban-sdk 22.0.11 pins soroban-env-host 22.1.3, which has an open-ended ed25519-dalek >=2.0.0 constraint that resolves an incompatible rand_core version. Upstream issue: https://github.com/stellar/rs-soroban-env/issues/1705. This job is non-blocking (continue-on-error) until upstream fixes it or the SDK is deliberately upgraded. See README.md for details."

      - name: Run Rust contract tests
        run: |
          set -e
          shopt -s nullglob
          manifests=(contracts/*/Cargo.toml)
          if [ "${#manifests[@]}" -eq 0 ]; then
            echo "No Cargo.toml manifests found under contracts/." >&2
            exit 1
          fi
          for manifest in "${manifests[@]}"; do
            echo "Testing $manifest"
            cargo test --manifest-path "$manifest"
          done
