[package]
name = "liquidation_engine"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
soroban-sdk = "22.0.0"

[dev_dependencies]
soroban-sdk = { version = "22.0.0", features = ["testutils"] }
# Used only by tests to exercise the real, hardened Oracle contract end-to-end
# (zero/stale price rejection), rather than a hand-rolled stand-in. Does not
# affect the deployed liquidation_engine WASM (dev-dependency only).
oracle = { path = "../oracle" }

[patch.crates-io]
# Upstream fix for stellar/rs-soroban-env#1705: soroban-env-host 22.1.3 declares an
# open-ended `ed25519-dalek = ">=2.0.0"` dependency, which resolves to ed25519-dalek
# 3.0.0 and pulls in rand_core 0.10.x. Elsewhere in the same graph, rand_chacha 0.3.1
# (also a direct soroban-env-host dependency) is built on rand_core 0.6.x. The two
# rand_core majors are incompatible traits, so soroban-env-host's own testutils.rs
# fails to compile (ChaCha20Rng does not implement CryptoRng from rand_core 0.10).
# Pinning via a plain version string under [patch.crates-io] is invalid Cargo syntax
# (patches must point to a different source); this pins the crates.io ed25519-dalek
# to the exact 2.2.0 release via its upstream git tag instead, which unifies the
# whole graph back onto rand_core 0.6.x and removes the incompatible edge entirely.
# Does not change soroban-sdk (still 22.0.0) or any contract source.
ed25519-dalek = { git = "https://github.com/dalek-cryptography/curve25519-dalek", tag = "ed25519-2.2.0" }

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true

[profile.release-with-logs]
inherits = "release"
debug-assertions = true
